name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets.xcconfig is gitignored (it holds the real Anthropic key), so CI needs
      # its own placeholder just to satisfy XcodeGen's configFiles reference. All LLM
      # network calls are mocked in tests, so no real key is ever needed here.
      - name: Create placeholder Secrets.xcconfig
        run: |
          cat > Secrets.xcconfig <<'EOF'
          // CI placeholder — never a real key. Tests mock all network calls.
          ANTHROPIC_API_KEY = ci-placeholder-not-a-real-key
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run BagelCore unit tests (SwiftPM)
        run: swift test --package-path BagelCore

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build BagelApp for Simulator
        run: |
          xcodebuild build \
            -project BagelApp.xcodeproj \
            -scheme BagelApp \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Run BagelAppTests on Simulator
        run: |
          xcodebuild test \
            -project BagelApp.xcodeproj \
            -scheme BagelApp \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  build-unsigned-ipa:
    # Produces an unsigned .ipa for real-device testing (e.g. via Sideloadly/AltStore
    # with a free Apple ID) since this project has no paid Apple Developer account and
    # no Mac here can run Xcode locally to build straight to a device.
    runs-on: macos-15
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same placeholder as the test job — the live Anthropic capture pipeline won't
      # work in this build until a real key is wired in (see PROGRESS.md).
      - name: Create placeholder Secrets.xcconfig
        run: |
          cat > Secrets.xcconfig <<'EOF'
          // CI placeholder — never a real key. Tests mock all network calls.
          ANTHROPIC_API_KEY = ci-placeholder-not-a-real-key
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned build for a real device
        run: |
          xcodebuild archive \
            -project BagelApp.xcodeproj \
            -scheme BagelApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BagelApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/BagelApp.xcarchive/Products/Applications/BagelApp.app Payload/
          zip -r BagelApp-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: BagelApp-unsigned-ipa
          path: BagelApp-unsigned.ipa
          retention-days: 14
