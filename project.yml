name: BagelApp

options:
  bundleIdPrefix: com.bagelapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  BagelCore:
    path: BagelCore

targets:
  BagelApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BagelApp
        excludes:
          - "Resources/Info.plist"
    info:
      path: BagelApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bagel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Bagel uses your camera to scan receipts and statements so it can itemize them for you."
        NSPhotoLibraryUsageDescription: "Bagel needs access to your photos so you can upload an existing picture of a receipt or statement."
        ANTHROPIC_API_KEY: "$(ANTHROPIC_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagelapp.BagelApp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: BagelCore

  BagelAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BagelAppTests
    dependencies:
      - target: BagelApp
    settings:
      base:
        SWIFT_VERSION: "5.9"

schemes:
  BagelApp:
    build:
      targets:
        BagelApp: all
    test:
      targets:
        - BagelAppTests
    run:
      config: Debug
